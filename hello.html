<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SR University</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(to right,#004080,#00bcd4);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:500px;
            padding:40px;
            text-align:center;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        h1{
            color:#004080;
            font-size:40px;
            margin-bottom:10px;
        }

        h2{
            color:#008080;
            margin-bottom:20px;
        }

        p{
            color:#555;
            font-size:18px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#004080;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
            transition:0.3s;
        }

        .btn:hover{
            background:#008080;
        }

        footer{
            margin-top:25px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome</h1>

        <h2>SR University</h2>

        <p>
            Welcome to SR University, where innovation,
            knowledge, and excellence come together to
            shape the leaders of tomorrow.
        </p>

        <a href="#" class="btn">Explore More</a>

        <footer>
            © 2026 SR University | School of Computer Science & Artificial Intelligence
        </footer>

    </div>

</body>
</html>
